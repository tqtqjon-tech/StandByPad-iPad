name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selected Xcode
        run: |
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep Xcode
      - name: Copy pinned upstream web assets
        run: bash scripts/sync-web-assets.sh
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -list -project StandByPad.xcodeproj
      - name: Build unsigned iPad app
        run: |
          set -o pipefail
          xcodebuild -project StandByPad.xcodeproj -scheme StandByPad \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log
      - name: Verify bundle and package IPA
        run: |
          set -euo pipefail
          app='build/Build/Products/Release-iphoneos/StandByPad.app'
          test -d "$app"
          test -f "$app/StandByPad"
          test -f "$app/native-bridge.js"
          python3 scripts/verify-assets.py "$app/WebAssets" WebAssets
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist" | grep -x tech.tqtqjon.standbypad
          file "$app/StandByPad" | grep arm64
          mkdir -p package/Payload
          ditto "$app" package/Payload/StandByPad.app
          cd package
          zip -q -r StandByPad.ipa Payload
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('StandByPad.ipa') as ipa:
              assert ipa.testzip() is None
              for path in ['StandByPad', 'Info.plist', 'native-bridge.js', 'WebAssets/index.html']:
                  assert 'Payload/StandByPad.app/' + path in ipa.namelist(), path
          print('Verified unsigned IPA structure')
          PY
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: StandByPad-unsigned-IPA
          path: package/StandByPad.ipa
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StandByPad-build-diagnostics
          path: |
            xcodebuild.log
            project.yml
            StandByPad.xcodeproj/project.pbxproj
